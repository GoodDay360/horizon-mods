id = "enemy_target_lock"
kind = "native-mod"
name = "Enemy Target Lock"
summary = "Lock onto mobs or players, adjust aim, and redirect clicks, with fail-closed multiplayer permission."
description = """
**Lock onto a mob, inspired by soulslike games.**

- **Middle-click** to lock onto the mob or player nearest your view; again to release.
- **Scroll** to switch targets left or right.
- **Automatic aim adjustment** turns your real aim toward the target while locked.
- **Left/right clicks** are redirected to the locked target instead of the crosshair ray.
- **Smooth camera**, with a cinematic over-the-shoulder view in third person.
- **Bows, tridents and thrown items** aim for drop and target movement.
- **Aim assist** optionally nudges aim toward a mob under the crosshair when not locked.
- Adjustable in-game: Options > Mods > Enemy Target Lock > Config.

**Multiplayer:** targeting and aim assistance are off by default. LAN hosting requires **Allow LAN Friends** to be explicitly enabled; dedicated servers require `allow_lock_on = true`. Unknown or lost host permission stays disabled. [How it works](https://github.com/GoodDay360/enemy-target-lock#multiplayer-and-fair-play).

![Locked onto a pillager](https://raw.githubusercontent.com/GoodDay360/enemy-target-lock/main/screenshots/1.jpg)

![Cinematic third-person lock-on](https://raw.githubusercontent.com/GoodDay360/enemy-target-lock/main/screenshots/2.jpg)

Native source mod: the launcher builds it for your Horizon version; it runs with your account's permissions. No Minecraft code or assets. MIT licensed."""
authors = ["GoodDay360"]
owners = ["GoodDay360"]
owner_ids = [59399625]
license = "MIT"
source = "https://github.com/GoodDay360/enemy-target-lock"
icon = "icons/enemy_target_lock.png"
categories = ["utility", "game-mechanics"]
tags = ["lock-on", "target-lock", "combat", "camera", "third-person", "aim", "bow"]
